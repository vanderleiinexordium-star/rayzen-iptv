name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/**"
      - "assets/**"
      - "app.config.ts"
      - "babel.config.js"
      - "metro.config.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "eas.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Embed JavaScript bundle in debug APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle_file = Path("android/app/build.gradle")
          source = gradle_file.read_text()
          marker = "react {"
          if marker not in source:
              raise SystemExit("React Native Gradle configuration not found in android/app/build.gradle")
          source = source.replace(
              marker,
              marker + "\\n    // Bundle the JavaScript app so the APK runs without Metro.\\n    debuggableVariants = []",
              1,
          )
          gradle_file.write_text(source)
          PY

      - name: Build standalone debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rayzen-iptv-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
